# docker compose up --build runs the whole app on http://localhost:8080 in replay mode (README "Run").
# bootRun starts only the postgres service (spring.docker.compose.start.arguments).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: afterbooth
      POSTGRES_USER: afterbooth
      POSTGRES_PASSWORD: local-only
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afterbooth -d afterbooth"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    # Optional: the app starts without the key file; replay needs no key
    env_file:
      - path: .env
        required: false
    environment:
      # Pinned literal, not ${AI_MODE}: environment beats env_file, so a plain up never spends credits.
      # Live mode is opt-in through docker-compose.live.yml.
      AI_MODE: replay
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/afterbooth
      SPRING_DATASOURCE_USERNAME: afterbooth
      SPRING_DATASOURCE_PASSWORD: local-only
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "8080:8080"

volumes:
  pgdata:

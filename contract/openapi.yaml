openapi: 3.1.0
info:
  title: AfterBooth API
  version: 0.3.0
  description: |
    API contract of record. The frontend generates its client and MSW mocks from this file (frontend `npm run gen:api`).
    Contract changes go in a separate commit that touches only contract/, recorded in docs/DECISIONS.md.

    Conventions
    - Times are ISO 8601. Responses use the +09:00 offset (Asia/Seoul). Relative times in speech ("8시까지") are
      resolved against the server clock in Asia/Seoul; for GIVER conditions, against the event's date.
    - Product UI, user-facing messages, category labels and AI-generated explanations are English. Original user input may remain Korean or another supported language. Display times explicitly in Asia/Seoul.
    - Sizes are centimeters. Bounding boxes are normalized to the photo (0..1).
    - Optional fields are omitted when empty, never sent as null.
    - Writes that create or change state take a required `Idempotency-Key` header (UUID, one per user action).
      The server fingerprints method + path + body (file hash for multipart). Same key + same fingerprint returns
      the stored first response without re-running anything. Same key + different fingerprint, or the same key
      while the first call is still running, returns 409 `IDEMPOTENCY_CONFLICT`. A missing key returns 400.
      Client rule: on `IDEMPOTENCY_CONFLICT`, retry with the same key after 1, 2 and 4 seconds (covers the in-flight
      case); if it still fails, show the message and treat the next tap as a new action with a new key.
    - Errors use the `Error` schema. `message` is English and safe to show to users. Any operation may also return
      500 `INTERNAL_ERROR`, and 405/415 `UNSUPPORTED_REQUEST` for a wrong method or content type (for example an
      audio format Voice Transcribe does not accept).
    - Version 0.3.0 is the target authentication contract. Issue #65 implements protected signup and common security/mail foundations first; #66 reuses them for login and sessions. Existing-domain member authorization remains subsequent work; distinguish target permissions from the current runtime implementation.
      Do not provide a configuration switch that disables authentication. Every API requires an ACTIVE member except getHealth and explicitly public authentication operations.
    - Authentication APIs, withdrawMember, and changePassword are exempt from Idempotency-Key. Never store requests or responses containing tokens, verification codes, or passwords in idempotency_record. Existing rules apply to other domain writes.
    - Before replaying a domain idempotency response, authenticate the member and check current authorization on the original resource. Scope keys by the server-derived member ID and record related_organization_ids for all givers and receivers represented in the response. Do not replay withdrawn or deleted responses.
    - On every JWT check, query DB member state, authVersion, unrevoked and unexpired sid, and organization membership. Fail closed with 503 AUTH_UNAVAILABLE on lookup failures. Withdrawal, logout-all, password reset, and password change immediately invalidate existing JWTs.
    - Determine organization ownership from organization.primary_member_id. Registration creates a private organization; joining existing shared or seeded organizations is unsupported. Unclaimed organizations and their data remain inaccessible until an explicit reviewed ownership assignment. Request organizationId or role is not proof of authorization.
    - Object-authorization failures return 404 NOT_FOUND without revealing existence. Lists return authorized rows only. Shared 401/403 responses also apply to domain APIs.
    - Clean up unverified registrations and their private organizations after 24 hours. New ACTIVE members can create their own events with createEvent.
    - Authentication responses use Cache-Control: no-store. Do not log authentication or mail-provider request bodies or Cookie/Authorization headers in logs, traces, or errors.
    - Cookie-based authentication POSTs, registration/login/verification/reset POSTs, membership withdrawal DELETE, and changePassword POST require both the exact allowed Origin and X-CSRF-Token. Missing Origin also returns CSRF_REJECTED. Use a synchronizer token bound to a server-issued CSRF session; SameSite alone is insufficient.
      Use HTTPS for deployment and authentication integration tests. Bearer-authenticated domain writes do not authenticate through cookies and do not require a CSRF header. CORS permits only the exact frontend Origin with credentials; wildcards are forbidden.
    - Withdrawal immediately removes personal information and revokes all sessions. Retain only minimal transaction history and a keyed normalized-email HMAC for 30 days from withdrawal. Delete the block information after 30 days and allow registration with the same email. Manage the HMAC key outside the DB.
    - Photo counting (intake and handover): Muse Spark finds and counts items and returns a box per item; SAM 3.1
      then segments each box (box prompts). "SAM segmented an item" means SAM returned a mask for its box with a
      score at or above the configured `afterbooth.ai.sam.min-score`. A completed SAM call may segment none of the
      boxes; that is a result, not a failure. A SAM call that errors or times out is a failure. When Spark counts
      no items there are no boxes and SAM is skipped: intake becomes READY with no lines, a handover is MISMATCH.
    - AI proposes, the server decides: the allocation agent can create at most a HELD reservation, and every tool
      call is validated by the same rules as `holdItem`.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Registration email verification, login, sessions, and password reset
  - name: members
    description: Current member information, password change, and membership withdrawal
  - name: system
  - name: catalog
    description: Seeded organizations and events
  - name: intake
    description: Photo → Muse Spark count and estimate → SAM 3.1 segmentation → inventory draft → confirm
  - name: conditions
    description: Voice or text → Voice Transcribe → Muse Spark structured conditions
  - name: inventory
  - name: requests
    description: Pickup requests and the allocation agent
  - name: reservations
  - name: handover
  - name: stats
paths:
  /api/auth/csrf:
    get:
      operationId: getCsrfToken
      tags:
        - auth
      summary: Issue a CSRF session and token
      description: >-
        Public endpoint. Return a random 256-bit token in the response body and bind it to a server session. Keep
        it in frontend memory and send it as X-CSRF-Token on every authentication POST member withdrawal DELETE,
        and changePassword POST. Login rotates the session and token; fetch a new token after login.
      security: []
      responses:
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '200':
          description: Request completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: Do not store authentication responses
            Set-Cookie:
              description: >-
                __Host-afterbooth-csrf-session; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=3600. No Domain
                attribute. Absolute server-session lifetime is 1 hour. An opaque identifier independent of the authentication
                cookie.
              schema:
                type: string
  /api/auth/registrations:
    post:
      operationId: registerMember
      tags:
        - auth
      summary: Register with email and password
      description: >-
        Email verification is used only for registration. Create a PENDING_VERIFICATION member and a private organization
        with a fixed generic name; never copy the email into its name. Do not issue JWTs before verification. Duplicate
        accounts, the 30-day re-registration block, and existing pending accounts receive the same generic 202 without
        a member ID or challengeId. Do not overwrite an existing password. Apply identical limits to real and dummy
        accounts: 5 requests per email per hour and 20 per IP per hour. Email limits retain the same 202; only IP
        limits return 429. Call requestEmailVerification separately to send the code. Authentication APIs do not
        use Idempotency-Key.
      security: []
      responses:
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '202':
          description: Request completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthAccepted'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: Do not store authentication responses
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMemberRequest'
  /api/auth/email-verifications/request:
    post:
      operationId: requestEmailVerification
      tags:
        - auth
      summary: Request a registration verification code
      description: >-
        Use the shared server mail gateway: explicit local Fake opt-in for simulation or explicit deployment Resend
        opt-in with external credentials; default delivery is disabled. Never automatically fall back to Fake.
        Local Fake may display only purpose/code in a private console; never in API responses or persistent logs.
        Per email and purpose: a 60-second issuance interval and 5 requests per
        hour; per IP: 20 per hour. Return the same 202 and an equivalent random challengeId regardless of account
        existence, state, or email limit. Missing or already verified accounts and exceeded email limits receive
        a dummy challengeId without sending mail. Only IP limits return 429. Six-digit codes expire after 10 minutes
        and allow at most 5 verification attempts. A new request invalidates the previous code for the same purpose.
        Never log mail bodies or recipients. The private local Fake purpose/code exception does not prove mailbox ownership.
      security: []
      responses:
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '202':
          description: Request completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeIssued'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: Do not store authentication responses
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChallengeRequest'
  /api/auth/email-verifications/confirm:
    post:
      operationId: verifyEmail
      tags:
        - auth
      summary: Complete registration email verification
      description: >-
        Validate challengeId, normalized email, purpose, and code together. Expired, incorrect, consumed, dummy,
        and over-attempt challenges return the same 400 INVALID_AUTH_CHALLENGE. On success, atomically consume the
        code and, only for a PENDING_VERIFICATION member, hash and set this request's password before changing the
        state to ACTIVE. Do not retain a password previously set by an attacker for a pending account. This API
        never changes an ACTIVE member's password. Keep the password entered at registration only in the in-memory
        form until verification; never log, cache, or persist it in browser storage. Return 204 without automatic
        login. Apply 5 attempts per challenge and a shared IP limit of 20 per hour. Confirmation requests do not
        use the 60-second issuance interval.
      security: []
      responses:
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '204':
          description: Request completed
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: Do not store authentication responses
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
  /api/auth/login:
    post:
      operationId: loginMember
      tags:
        - auth
      summary: Log in with email and password
      description: >-
        Return 403 EMAIL_NOT_VERIFIED only for a PENDING_VERIFICATION member after verifying the correct password.
        Missing accounts, incorrect passwords, and WITHDRAWN accounts receive the same 401 UNAUTHENTICATED. Only
        ACTIVE members receive an access JWT and a new opaque refresh-token session. JWT lifetime is 10 minutes;
        store it only in frontend memory, never localStorage or sessionStorage. Refresh tokens use at least 256
        CSPRNG bits; store only their hashes in refresh_token. refresh_session is a stable family row whose ID is
        the JWT sid. Rotation creates a new token row under the same session and records used_at on the previous
        token. Absolute family lifetime is 7 days. Login limits are 20 per IP per hour and a temporary restriction
        after 5 failures per email in 15 minutes; no permanent lockout. Login also rotates the CSRF session and
        sets __Host-afterbooth-csrf-session in a separate Set-Cookie header with the same attributes as getCsrfToken.
      security: []
      responses:
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '200':
          description: Request completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: Do not store authentication responses
            Set-Cookie:
              schema:
                type: string
              description: >-
                __Host-afterbooth-refresh; HttpOnly; Secure; SameSite=Lax; Path=/. Max-Age is the remaining absolute
                session-family lifetime in seconds, at most 604800. No Domain attribute. Set on issuance and rotation;
                use Max-Age=0 on revocation. Never record cookie values in documentation or logs.
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginMemberRequest'
  /api/auth/refresh:
    post:
      operationId: refreshSession
      tags:
        - auth
      summary: Rotate the refresh token and reissue an access JWT
      description: >-
        Require the refresh cookie. Atomically invalidate the previous token and issue a new token on each use.
        Rotation does not extend the absolute expiry of 7 days from initial family issuance. Reuse of a consumed
        token revokes the entire family. Check member state, authVersion, and family expiry; on failure return 401
        and clear the cookie. Serialize refresh requests on the client. Require CSRF and Origin validation. An access
        JWT alone cannot refresh a session.
      security:
        - refreshCookie: []
      responses:
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '200':
          description: Request completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: Do not store authentication responses
            Set-Cookie:
              schema:
                type: string
              description: >-
                __Host-afterbooth-refresh; HttpOnly; Secure; SameSite=Lax; Path=/. Max-Age is the remaining absolute
                session-family lifetime in seconds, at most 604800. No Domain attribute. Set on issuance and rotation;
                use Max-Age=0 on revocation. Never record cookie values in documentation or logs.
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
  /api/auth/logout:
    post:
      operationId: logoutSession
      tags:
        - auth
      summary: Log out of the current session
      description: >-
        Revoke the current refresh-token family and clear the refresh cookie. Missing or expired cookies and repeated
        calls return 204. Check session sid revocation on every request to reject the access JWT immediately. Always
        validate CSRF and Origin. The frontend also clears its in-memory JWT.
      security: []
      responses:
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '204':
          description: Request completed
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: Do not store authentication responses
            Set-Cookie:
              schema:
                type: string
              description: >-
                __Host-afterbooth-refresh; HttpOnly; Secure; SameSite=Lax; Path=/. Max-Age is the remaining absolute
                session-family lifetime in seconds, at most 604800. No Domain attribute. Set on issuance and rotation;
                use Max-Age=0 on revocation. Never record cookie values in documentation or logs.
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
  /api/auth/logout-all:
    post:
      operationId: logoutAllSessions
      tags:
        - auth
      summary: Log out of all sessions
      description: >-
        Revoke every refresh-token family for the ACTIVE member and increment authVersion to reject all existing
        JWTs immediately. Clear the current refresh cookie. A repeated call without a valid JWT returns 401; do
        not replay credential responses.
      security:
        - bearerAuth: []
      responses:
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '204':
          description: Request completed
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: Do not store authentication responses
            Set-Cookie:
              schema:
                type: string
              description: >-
                __Host-afterbooth-refresh; HttpOnly; Secure; SameSite=Lax; Path=/. Max-Age is the remaining absolute
                session-family lifetime in seconds, at most 604800. No Domain attribute. Set on issuance and rotation;
                use Max-Age=0 on revocation. Never record cookie values in documentation or logs.
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
  /api/auth/password-resets/request:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Request a password reset code
      description: >-
        Use the PASSWORD_RESET purpose, separate from registration verification. Send through Resend only for ACTIVE
        accounts. Return the same 202 and equivalent random challengeId regardless of account existence, state,
        or email limit. Per email and purpose: a 60-second interval and 5 requests per hour; per IP: 20 per hour,
        with 429 only for IP limits. Six-digit codes expire in 10 minutes and allow 5 attempts. New issuance invalidates
        the previous code for the same purpose.
      security: []
      responses:
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '202':
          description: Request completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeIssued'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: Do not store authentication responses
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChallengeRequest'
  /api/auth/password-resets/confirm:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Complete password reset
      description: >-
        Validate and atomically consume challengeId, email, PASSWORD_RESET purpose, and code. Return the same 400
        INVALID_AUTH_CHALLENGE on failure. On success, replace the password hash, increment authVersion, and revoke
        all refresh tokens to reject existing JWTs immediately. Return 204 without automatic login. Apply 5 attempts
        per challenge and a shared IP limit of 20 per hour. Confirmation does not use the 60-second issuance interval.
        Acquire the same member-row lock used by changePassword and recheck the ACTIVE member and challenge after
        locking. In the password-update transaction, invalidate every outstanding PASSWORD_RESET challenge and all
        member-linked CSRF sessions so older codes cannot restore an earlier password after a later change. Expire
        both the refresh and CSRF-session cookies using separate Set-Cookie headers. The client clears authenticated
        caches and its token and must log in again.
      security: []
      responses:
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '204':
          description: Request completed
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: Do not store authentication responses
            Set-Cookie:
              schema:
                type: string
              description: |-
                Send two separate Set-Cookie headers; never combine them into one comma-separated header:
                __Host-afterbooth-refresh=; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=0
                __Host-afterbooth-csrf-session=; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=0
                Both omit Domain. Clear both cookies with the same names, paths, and security attributes used for issuance. Never log cookie values.
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
  /api/members/me:
    get:
      operationId: getCurrentMember
      tags:
        - members
      summary: Get the current member
      description: >-
        Return only the ACTIVE member's own information. Withdrawn members receive 401 without email or withdrawal
        time.
      security:
        - bearerAuth: []
      responses:
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '200':
          description: Request completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberView'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: Do not store authentication responses
        '401':
          $ref: '#/components/responses/Unauthenticated'
    delete:
      operationId: withdrawMember
      tags:
        - members
      summary: Withdraw membership
      description: >-
        Require password confirmation. Return 409 WITHDRAWAL_BLOCKED for a HELD or CONFIRMED reservation involving
        the member as giver or receiver, or a MISMATCH handover attached to a currently CONFIRMED reservation. HELD
        blocks withdrawal even after its TTL until an actual EXPIRED transition. Check and withdraw atomically against
        new transactions. HANDED_OVER, RELEASED, and EXPIRED reservations, COMPLETED handovers, and historical MISMATCH
        records on terminal reservations do not block withdrawal. On success, set WITHDRAWN, immediately delete
        personal fields, revoke all refresh tokens, increment authVersion, and clear the refresh cookie. Retain
        only minimal transaction history and the normalized-email HMAC for 30 days from withdrawal, then delete
        them. Reject registration with the same email for 30 days and allow it afterward. Repeated calls return
        401 because the previous JWT is immediately invalid.
      security:
        - bearerAuth: []
      responses:
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '204':
          description: Request completed
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: Do not store authentication responses
            Set-Cookie:
              schema:
                type: string
              description: >-
                __Host-afterbooth-refresh; HttpOnly; Secure; SameSite=Lax; Path=/. Max-Age is the remaining absolute
                session-family lifetime in seconds, at most 604800. No Domain attribute. Set on issuance and rotation;
                use Max-Age=0 on revocation. Never record cookie values in documentation or logs.
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/WithdrawalBlocked'
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawMemberRequest'
  /api/members/me/password:
    post:
      operationId: changePassword
      tags:
        - members
      summary: Change the current password
      description: |-
        Only the current ACTIVE member may change their own password. Require Bearer authentication, X-CSRF-Token, and an exact allowed Origin; reject a missing Origin with 403 CSRF_REJECTED. No email confirmation, verification code, or email delivery is involved.
        Acquire the member-row lock for the final mutation and recheck ACTIVE state, authVersion, and the submitted current credential. A wrong currentPassword returns 403 INVALID_CURRENT_PASSWORD. Apply a 15-minute block after 5 failed current-password checks per member within 15 minutes, and 20 requests per IP per hour; rate limits return 429 RATE_LIMITED with Retry-After.
        In the same transaction, store the newPassword hash prepared with the shared Argon2id policy, replace password_hash, increment auth_version, revoke ALL refresh-token families and therefore every existing JWT including the caller, invalidate every outstanding PASSWORD_RESET challenge, and invalidate all member-linked CSRF sessions. Serialize with password reset under the same member-row lock so an old code cannot undo a newer password change.
        Return 204 with no automatic login. Expire the refresh and CSRF-session cookies using separate Set-Cookie headers. The client clears its access token and authenticated caches and requires login again. Do not require Idempotency-Key, store credential requests or responses in idempotency_record, or replay a credential response. A repeated request with the old JWT returns 401.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed; all sessions require authentication again
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: Do not store authentication responses
            Set-Cookie:
              schema:
                type: string
              description: |-
                Send two separate Set-Cookie headers; never combine them into one comma-separated header:
                __Host-afterbooth-refresh=; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=0
                __Host-afterbooth-csrf-session=; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=0
                Both omit Domain. Clear both cookies with the same names, paths, and security attributes used for issuance. Never log cookie values.
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: >-
            Wrong current password returns INVALID_CURRENT_PASSWORD. Invalid or missing CSRF token or exact Origin: CSRF_REJECTED.
            Other access denial: FORBIDDEN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

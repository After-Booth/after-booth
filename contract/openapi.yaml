    post:
      operationId: confirmReservation
      tags:
        - reservations
      summary: The receiver confirms a HELD reservation (HELD → CONFIRMED)
      description: |
        Succeeds only while the server clock is before `holdExpiresAt`. Confirm and expiry are both conditional state
        updates on the same row, so exactly one wins. If expiry wins (or the time has passed but the scheduler has
        not run yet), the reservation becomes EXPIRED, its quantity is restored once, and the call fails with
        409 HOLD_EXPIRED.
        Access: Only the receiver request organization's owner may confirm it.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/reservations/{reservationId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ReservationId'
    post:
      operationId: cancelReservation
      tags:
        - reservations
      summary: Cancel a HELD or CONFIRMED reservation (→ RELEASED) and restore its quantity
      description: |
        Any other status fails with 409 INVALID_TRANSITION.
        Access: Only the receiver request organization's owner may cancel it.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/reservations/{reservationId}/handover:
    parameters:
      - $ref: '#/components/parameters/ReservationId'
    post:
      operationId: submitHandoverPhoto
      tags:
        - handover
      summary: Recount a CONFIRMED reservation from one pickup photo
      description: |
        Muse Spark counts the items of the reserved category in the photo, SAM 3.1 segments each counted item from
        Spark's boxes, and the server writes a `handover_log` row. The row is written only after both calls
        completed (or Spark counted none, which skips SAM and is MISMATCH); if either fails, the response is 503 AI_UNAVAILABLE, nothing is written and the reservation is
        unchanged. The count matches only if it equals the reserved quantity and SAM segmented every box (see the
        photo counting convention above); a completed SAM call that segments fewer boxes, or none, is MISMATCH.
        - Count matches: the reservation becomes HANDED_OVER with `handedOverQty` = quantity,
          the log row gets `accepted_qty` at once, and the reuse is recorded. No `resolveHandover` call follows.
        - Otherwise: the result is MISMATCH and the reservation stays CONFIRMED. The person either retakes the photo
          (a new call with a new Idempotency-Key; the newest log row supersedes older ones) or settles it with
          `resolveHandover`.
        Only CONFIRMED reservations (INVALID_TRANSITION otherwise) before their pickup deadline (PICKUP_CLOSED).
        Access: Only the giver event organization's owner may execute this operation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - photo
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Counted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/AiUnavailable'
  /api/reservations/{reservationId}/handover/resolve:
    parameters:
      - $ref: '#/components/parameters/ReservationId'
    post:
      operationId: resolveHandover
      tags:
        - handover
      summary: A person settles a count mismatch and completes the handover
      description: |
        Only after a photo count: the reservation must be CONFIRMED and its newest `handover_log` row must be
        MISMATCH, otherwise 409 INVALID_TRANSITION. A handover can never complete without a completed photo recount:
        the Muse Spark call completed, and the SAM 3.1 call completed whenever Spark counted at least one item (a
        zero count skips SAM). That `handover_log` row is the evidence. Every MISMATCH may be settled here,
        including SAM segmenting fewer boxes than Spark counted (even none) and a Spark count of zero; the person
        may accept any quantity up to the reserved one, or retake the photo instead.
        `acceptedQty` greater than the reserved quantity fails with 400 INVALID_INPUT.

        In one transaction: the newest MISMATCH log row gets `accepted_qty`, the reservation becomes HANDED_OVER
        with `handedOverQty` = `acceptedQty`, the unreceived remainder (quantity − acceptedQty) returns to the
        item's availableQty, and the reuse of `acceptedQty` is recorded. The result status is always COMPLETED.
        If nothing was received, use `cancelReservation` instead.
        Access: Only the giver event organization's owner may execute this operation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveHandoverRequest'
      responses:
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Handed over
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/stats/reuse:
    get:
      operationId: getReuseStats
      tags:
        - stats
      summary: Reused quantities per category and per event
      description: >-
        Provide ACTIVE members only global aggregates without personal identifiers. eventId filters may reference
        only their own events; return 404 for others.
      parameters:
        - name: eventId
          in: query
          description: Limit to one event
          schema:
            type: integer
            format: int64
      responses:
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReuseStats'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        10-minute JWT. Pin RS256 and validate iss, aud, exp, iat, jti, sub, sid, and authVersion. On every request,
        check ACTIVE state, authVersion, and an unrevoked, unexpired sid in the DB. Fail closed with 503 AUTH_UNAVAILABLE
        on DB lookup failure. Use an allowlist of kid values for key rotation.
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-afterbooth-refresh
      description: Opaque refresh token with at least 256 bits. Require CSRF and exact Origin validation together.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Server-session-bound token returned by getCsrfToken. An exact allowed Origin is also required.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID, one per user action, reused on retry of that action
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    DraftId:
      name: draftId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    AuthUnavailable:
      description: Authentication-store lookup failure. Fail closed rather than bypassing authentication (AUTH_UNAVAILABLE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: >-
        Missing, expired, revoked, or withdrawn authentication, or an incorrect password: UNAUTHENTICATED. Do not
        distinguish account existence or withdrawal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: >-
        Access denied: FORBIDDEN. CSRF or Origin failure: CSRF_REJECTED. Only login may return EMAIL_NOT_VERIFIED
        after verifying the correct password.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthBadRequest:
      description: 'Invalid input: INVALID_INPUT, or uniformly handled INVALID_AUTH_CHALLENGE.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    WithdrawalBlocked:
      description: 'An ongoing transaction prevents withdrawal: WITHDRAWAL_BLOCKED.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: 'Request limit exceeded: RATE_LIMITED. Wait for Retry-After before retrying.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            minimum: 1
    BadRequest:
      description: Invalid input or missing Idempotency-Key (INVALID_INPUT)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found (NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        Business rule or state conflict: QTY_UNAVAILABLE, QTY_EXCEEDS_REQUEST, PICKUP_CLOSED, VEHICLE_TOO_SMALL,
        INVALID_TRANSITION, HOLD_EXPIRED, REQUEST_ALREADY_HELD, DRAFT_NOT_READY, DRAFT_ALREADY_CONFIRMED,
        IDEMPOTENCY_CONFLICT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AiUnavailable:
      description: >-
        A Meta call failed or no replay fixture exists (AI_UNAVAILABLE), or the shared authentication DB lookup
        failed (AUTH_UNAVAILABLE). Neither failure permits access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CreateEventRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - venue
        - teardownDeadline
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        venue:
          type: string
          minLength: 1
          maxLength: 200
        teardownDeadline:
          type: string
          format: date-time
          description: Event teardown deadline after the current server time. Do not enter personal information.
    MemberState:
      type: string
      enum:
        - PENDING_VERIFICATION
        - ACTIVE
        - WITHDRAWN
    NormalizedEmail:
      type: string
      format: email
      maxLength: 254
      description: >-
        Accept ASCII email addresses only. Limit the local part to 64 characters; reject display names, comments,
        control characters, and non-ASCII addresses. Trim outer ASCII spaces (U+0020), then lowercase the entire
        address. Disallow internal spaces. Do not normalize plus or dot aliases. Use the normalized value for duplicate,
        verification, and re-registration-block comparisons.
    MemberPassword:
      type: string
      format: password
      minLength: 12
      maxLength: 128
      writeOnly: true
      description: >-
        12 to 128 characters; do not trim, change case, or normalize Unicode. Initial Argon2id parameters: 19 MiB
        memory, 2 iterations, parallelism 1. Verify support and load during subsequent implementation.
    RegisterMemberRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          $ref: '#/components/schemas/NormalizedEmail'
        password:
          $ref: '#/components/schemas/MemberPassword'
    LoginMemberRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          $ref: '#/components/schemas/NormalizedEmail'
        password:
          $ref: '#/components/schemas/MemberPassword'
    EmailChallengeRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          $ref: '#/components/schemas/NormalizedEmail'
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - challengeId
        - code
        - password
      properties:
        password:
          $ref: '#/components/schemas/MemberPassword'
        email:
          $ref: '#/components/schemas/NormalizedEmail'
        challengeId:
          type: string
          description: >-
            Opaque identifier with at least 256 CSPRNG bits. Real and dummy identifiers use the same format. This
            is not the verification code.
        code:
          type: string
          pattern: ^[0-9]{6}$
          writeOnly: true
          description: >-
            Valid for 10 minutes, at most 5 attempts, and one-time consumption. Store only a keyed HMAC of challengeId,
            purpose, normalized email, and code on the server.
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - challengeId
        - code
        - newPassword
      properties:
        email:
          $ref: '#/components/schemas/NormalizedEmail'
        challengeId:
          type: string
          description: >-
            Opaque identifier with at least 256 CSPRNG bits. Real and dummy identifiers use the same format. This
            is not the verification code.
        code:
          type: string
          pattern: ^[0-9]{6}$
          writeOnly: true
          description: >-
            Valid for 10 minutes, at most 5 attempts, and one-time consumption. Store only a keyed HMAC of challengeId,
            purpose, normalized email, and code on the server.
        newPassword:
          $ref: '#/components/schemas/MemberPassword'
    WithdrawMemberRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          $ref: '#/components/schemas/MemberPassword'
    AuthAccepted:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          description: The same English guidance without distinguishing account existence, duplicates, or re-registration
            blocks
    ChallengeIssued:
      type: object
      additionalProperties: false
      required:
        - message
        - challengeId
      properties:
        message:
          type: string
          description: The same guidance without distinguishing delivery, account state, or email limits
        challengeId:
          type: string
          description: >-
            Opaque identifier with at least 256 CSPRNG bits. Real and dummy identifiers use the same format. This
            is not the verification code.
    AccessTokenResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: Access JWT stored only in memory. Do not include actual token examples.
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          enum:
            - 600
    CsrfTokenResponse:
      type: object
      additionalProperties: false
      required:
        - csrfToken
      properties:
        csrfToken:
          type: string
          description: Token with at least 256 CSPRNG bits, bound to a server CSRF session. Keep it in memory.
    MemberView:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - state
        - organizationId
      properties:
        id:
          type: integer
          format: int64
        email:
          $ref: '#/components/schemas/NormalizedEmail'
        state:
          $ref: '#/components/schemas/MemberState'
        organizationId:
          type: integer
          format: int64
      description: >-
        Return only the current ACTIVE member's information. Never expose personal fields from WITHDRAWN rows through
        the API.
    Health:
      type: object
      required:
        - status
        - aiMode
      properties:
        status:
          type: string
          enum:
            - UP
        aiMode:
          $ref: '#/components/schemas/AiMode'
    AiMode:
      type: string
      enum:
        - live
        - record
        - replay
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: English message shown to the user
          example: Not enough quantity is available.
    ErrorCode:
      type: string
      enum:
        - INVALID_INPUT
        - NOT_FOUND
        - UNSUPPORTED_REQUEST
        - INTERNAL_ERROR
        - QTY_UNAVAILABLE
        - QTY_EXCEEDS_REQUEST
        - PICKUP_CLOSED
        - VEHICLE_TOO_SMALL
        - INVALID_TRANSITION
        - HOLD_EXPIRED
        - REQUEST_ALREADY_HELD
        - DRAFT_NOT_READY
        - DRAFT_ALREADY_CONFIRMED
        - IDEMPOTENCY_CONFLICT
        - AI_UNAVAILABLE
        - AUTH_UNAVAILABLE
        - UNAUTHENTICATED
        - FORBIDDEN
        - CSRF_REJECTED
        - EMAIL_NOT_VERIFIED
        - INVALID_AUTH_CHALLENGE
        - RATE_LIMITED
        - WITHDRAWAL_BLOCKED
        - INVALID_CURRENT_PASSWORD
    ItemCategory:
      type: string
      description: |
        The three categories in scope. Every `label` field is derived from this table on the server; clients show it as is.

        | Category | label |
        |---|---|
        | DISPLAY_RACK | Display rack |
        | STORAGE_BIN | Storage bin |
        | FOLDING_TABLE | Folding table |
      enum:
        - DISPLAY_RACK
        - STORAGE_BIN
        - FOLDING_TABLE
    DraftCategory:
      type: string
      description: |
        ItemCategory plus UNKNOWN (label Uncategorized), which can only appear in intake drafts and must be fixed before confirm
      enum:
        - DISPLAY_RACK
        - STORAGE_BIN
        - FOLDING_TABLE
        - UNKNOWN
    Condition:
      type: string
      enum:
        - GOOD
        - FAIR
        - POOR
    VehicleType:
      type: string
      description: |
        Ordered by cargo space, smallest first. An item fits a vehicle when its size fits that vehicle's cargo
        constants AND the vehicle is at least the item's `vehicleRequirement` (if set).
      enum:
        - SEDAN
        - SUV
        - VAN
        - TRUCK_1T
    SizeCm:
      type: object
      required:
        - width
        - depth
        - height
      properties:
        width:
          type: integer
          minimum: 1
        depth:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
      example:
        width: 90
        depth: 40
        height: 180
    BoundingBox:
      type: object
      description: Normalized to the photo, origin top-left
      required:
        - x
        - y
        - width
        - height
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
        width:
          type: number
          minimum: 0
          maximum: 1
        height:
          type: number
          minimum: 0
          maximum: 1
    Organization:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Local Market Team
    Event:
      type: object
      required:
        - id
        - name
        - organizationId
        - venue
        - teardownDeadline
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Autumn Pop-up
        organizationId:
          type: integer
          format: int64
          description: The giver that runs the event
        venue:
          type: string
          example: Seongdong-gu, Seoul
        teardownDeadline:
          type: string
          format: date-time
          description: Booths must be cleared by this time. Item pickup deadlines default to it and may not exceed
            it
    IntakeStatus:
      type: string
      enum:
        - PROCESSING
        - READY
        - FAILED
        - CONFIRMED
    IntakeStage:
      type: string
      description: |
        Runs ESTIMATE first, then SEGMENT. ESTIMATE = Muse Spark finds and counts items with category, box, size and
        condition; SEGMENT = SAM 3.1 segments each item from Spark's boxes
      enum:
        - ESTIMATE
        - SEGMENT
    IntakeDraft:
      type: object
      required:
        - id
        - eventId
        - status
        - lines
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        eventId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/IntakeStatus'
        stage:
          description: Current stage while PROCESSING, the failed stage when FAILED, for the progress UI
          $ref: '#/components/schemas/IntakeStage'
        failureMessage:
          type: string
          description: English, shown to the user when status is FAILED
        lines:
          type: array
          description: One line per category. Empty until READY
          items:
            $ref: '#/components/schemas/DraftLine'
        createdAt:
          type: string
          format: date-time
    DraftLine:
      type: object
      required:
        - lineId
        - category
        - label
        - count
        - boxes
        - condition
        - confidence
        - needsReview
      properties:
        lineId:
          type: integer
          format: int64
        category:
          $ref: '#/components/schemas/DraftCategory'
        label:
          type: string
          description: English category name for display
          example: Display rack
        count:
          type: integer
          minimum: 0
          description: Items Muse Spark counted for this category
          example: 4
        boxes:
          type: array
          description: One box per counted item, for the overlay. SAM 3.1's box when it segmented the item, else
            Spark's
          items:
            $ref: '#/components/schemas/BoundingBox'
        sizeCm:
          $ref: '#/components/schemas/SizeCm'
        condition:
          $ref: '#/components/schemas/Condition'
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Muse Spark confidence for category, size and condition
          example: 0.86
        needsReview:
          type: boolean
          description: |
            True when confidence is below the configured threshold, the category is UNKNOWN, SAM 3.1 did not segment
            one of the boxes (or the SAM call failed), or an optional SAM 3.1 count disagrees with `count`
    ConfirmIntakeRequest:
      type: object
      required:
        - lines
      properties:
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ConfirmLine'
        pickupDeadline:
          type: string
          format: date-time
          description: Defaults to the event teardown deadline; may not be later than it
        vehicleRequirement:
          description: Smallest vehicle the giver requires for pickup, e.g. from "승합차 필요". Absent = no requirement
          $ref: '#/components/schemas/VehicleType'
        conditionsTranscript:
          type: string
          description: Original spoken or typed giver conditions, kept for display
    ConfirmLine:
      type: object
      required:
        - lineId
        - category
        - quantity
        - sizeCm
        - condition
      properties:
        lineId:
          type: integer
          format: int64
        category:
          $ref: '#/components/schemas/ItemCategory'
        quantity:
          type: integer
          minimum: 1
        sizeCm:
          $ref: '#/components/schemas/SizeCm'
        condition:
          $ref: '#/components/schemas/Condition'
    ConditionContext:
      type: string
      description: GIVER = conditions attached to leftover items; RECEIVER = a pickup request
      enum:
        - GIVER
        - RECEIVER
    Conditions:
      type: object
      description: Every field is optional; Spark fills only what was said
      properties:
        category:
          $ref: '#/components/schemas/ItemCategory'
        quantity:
          type: integer
          minimum: 1
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        pickupDeadline:
          type: string
          format: date-time
          description: GIVER = must be picked up by; RECEIVER = can pick up by
        purpose:
          type: string
          example: Display equipment for a weekend event
    ConditionInterpretation:
      type: object
      required:
        - context
        - transcript
        - conditions
        - missingFields
      properties:
        context:
          $ref: '#/components/schemas/ConditionContext'
        transcript:
          type: string
          description: Voice Transcribe output, or the text as sent
          example: 주말 행사용 진열대 필요하고 승용차만 있어요
        conditions:
          $ref: '#/components/schemas/Conditions'
        missingFields:
          type: array
          description: Required fields for the next step that were not said (RECEIVER - category, vehicleType)
          items:
            type: string
            enum:
              - category
              - quantity
              - vehicleType
              - pickupDeadline
              - purpose
    CreatePickupRequest:
      type: object
      required:
        - organizationId
        - category
        - quantity
        - vehicleType
      properties:
        organizationId:
          type: integer
          format: int64
          description: The receiving organization
        category:
          $ref: '#/components/schemas/ItemCategory'
        quantity:
          type: integer
          minimum: 1
          description: The UI defaults to 1 when not said
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        pickupDeadline:
          type: string
          format: date-time
          description: When the receiver can pick up by. Informational; item deadlines are what the server enforces
        purpose:
          type: string
        transcript:
          type: string
          description: Original spoken or typed request, kept for display and for the agent
    PickupRequest:
      type: object
      required:
        - id
        - organizationId
        - category
        - quantity
        - vehicleType
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        organizationId:
          type: integer
          format: int64
        category:
          $ref: '#/components/schemas/ItemCategory'
        quantity:
          type: integer
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        pickupDeadline:
          type: string
          format: date-time
        purpose:
          type: string
        transcript:
          type: string
        createdAt:
          type: string
          format: date-time
    Item:
      type: object
      required:
        - id
        - eventId
        - organizationId
        - category
        - label
        - sizeCm
        - condition
        - totalQty
        - availableQty
        - pickupDeadline
      properties:
        id:
          type: integer
          format: int64
        eventId:
          type: integer
          format: int64
        organizationId:
          type: integer
          format: int64
          description: The giver
        category:
          $ref: '#/components/schemas/ItemCategory'
        label:
          type: string
          example: Display rack
        sizeCm:
          $ref: '#/components/schemas/SizeCm'
        condition:
          $ref: '#/components/schemas/Condition'
        totalQty:
          type: integer
          minimum: 0
        availableQty:
          type: integer
          minimum: 0
          description: |
            totalQty − Σ quantity of HELD and CONFIRMED reservations − Σ handedOverQty of HANDED_OVER reservations.
            RELEASED and EXPIRED reservations do not count.
        pickupDeadline:
          type: string
          format: date-time
        vehicleRequirement:
          description: Smallest vehicle the giver requires. Absent = no requirement beyond size
          $ref: '#/components/schemas/VehicleType'
        conditionsTranscript:
          type: string
          description: >-
            Raw text included only for the giver organization's owner. Omit the field from listItems/getItem responses
            to other members.
    AllocationStatus:
      type: string
      enum:
        - HELD
        - NO_MATCH
    AllocationResult:
      type: object
      required:
        - requestId
        - status
        - explanation
        - reservations
        - rejections
        - alternatives
        - toolCalls
      properties:
        requestId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/AllocationStatus'
        explanation:
          type: string
          description: English summary for the receiver, by Muse Spark or a server template if the model failed after
            a hold
          example: At 180 cm tall, it will not fit a sedan. How about 3 folding tables?
        reservations:
          type: array
          description: Reservations the agent held (status HELD only)
          items:
            $ref: '#/components/schemas/Reservation'
        rejections:
          type: array
          description: Candidates the server rejected, with the reason
          items:
            $ref: '#/components/schemas/Rejection'
        alternatives:
          type: array
          description: Items the receiver can hold instead with `holdItem`
          items:
            $ref: '#/components/schemas/Alternative'
        toolCalls:
          type: array
          description: The agent's tool calls in order, shown in the UI so the server's decisions are visible
          items:
            $ref: '#/components/schemas/ToolCall'
    RejectionCode:
      type: string
      enum:
        - VEHICLE_TOO_SMALL
        - QTY_UNAVAILABLE
        - QTY_EXCEEDS_REQUEST
        - PICKUP_CLOSED
        - CATEGORY_MISMATCH
    Rejection:
      type: object
      required:
        - itemId
        - code
        - message
      properties:
        itemId:
          type: integer
          format: int64
        code:
          $ref: '#/components/schemas/RejectionCode'
        message:
          type: string
          example: At 180 cm tall, it will not fit a sedan.
        limitingDimension:
          type: string
          description: Set for VEHICLE_TOO_SMALL when size (not the giver's requirement) is the reason
          enum:
            - width
            - depth
            - height
    Alternative:
      type: object
      required:
        - item
        - quantity
        - reason
      properties:
        item:
          $ref: '#/components/schemas/Item'
        quantity:
          type: integer
          minimum: 1
          description: Quantity the agent suggests holding, within the request quantity
        reason:
          type: string
          example: It folds to fit in a sedan.
    ToolCall:
      type: object
      required:
        - name
        - arguments
        - outcome
      properties:
        name:
          type: string
          enum:
            - searchCandidates
            - checkVehicleFit
            - holdQuantity
        arguments:
          type: object
          additionalProperties: true
        outcome:
          type: string
          description: REJECTED only for checkVehicleFit and holdQuantity calls the server refused
          enum:
            - OK
            - REJECTED
        code:
          description: Why the server refused, when REJECTED
          $ref: '#/components/schemas/RejectionCode'
        summary:
          type: string
          description: Short English description of the result
    ReservationStatus:
      type: string
      description: |
        | Transition | Trigger | Actor | Quantity effect |
        |---|---|---|---|
        | → HELD | `holdQuantity` tool or `holdItem` | AGENT / USER | −quantity |
        | HELD → CONFIRMED | `confirmReservation` before `holdExpiresAt` | USER | none |
        | HELD → EXPIRED | now ≥ `holdExpiresAt` (scheduler, or lazily on confirm) | SCHEDULER | +quantity |
        | HELD, CONFIRMED → RELEASED | `cancelReservation` | USER | +quantity |
        | CONFIRMED → RELEASED | now ≥ `pickupDeadline` without handover | SCHEDULER | +quantity |
        | CONFIRMED → HANDED_OVER | handover count matches, or `resolveHandover` | HANDOVER / USER | +(quantity − handedOverQty) |

        `holdExpiresAt` = min(hold time + hold TTL, item `pickupDeadline`), so HELD never outlives the pickup deadline.
        The hold TTL is 15 minutes (server setting `afterbooth.hold-ttl`, default `PT15M`).
        Every quantity effect is applied exactly once, in the same transaction as the status change.
        Any other transition fails with INVALID_TRANSITION.
      enum:
        - HELD
        - CONFIRMED
        - HANDED_OVER
        - RELEASED
        - EXPIRED
    HoldItemRequest:
      type: object
      description: |
        Hold rules, shared by `holdItem` and the agent's `holdQuantity` tool:
        - item.availableQty ≥ quantity (conditional update; QTY_UNAVAILABLE)
        - now < item.pickupDeadline (PICKUP_CLOSED)
        - the item fits request.vehicleType (VEHICLE_TOO_SMALL)
        - Σ quantity of the request's HELD and CONFIRMED reservations + quantity ≤ request.quantity (QTY_EXCEEDS_REQUEST)

        Holds for the same request are serialized: the server locks the pickup request row before reading its
        active reservations and keeps the lock until the new reservation is written, so two concurrent holds on
        different items cannot together exceed request.quantity.
      required:
        - requestId
        - itemId
        - quantity
      properties:
        requestId:
          type: integer
          format: int64
        itemId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
    Reservation:
      type: object
      required:
        - id
        - requestId
        - organizationId
        - itemId
        - itemLabel
        - quantity
        - status
        - holdExpiresAt
        - pickupDeadline
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        requestId:
          type: integer
          format: int64
        organizationId:
          type: integer
          format: int64
          description: The receiving organization
        itemId:
          type: integer
          format: int64
        itemLabel:
          type: string
          example: Display rack
        quantity:
          type: integer
          minimum: 1
          description: Reserved quantity
        handedOverQty:
          type: integer
          minimum: 1
          description: Quantity actually handed over. Set only when HANDED_OVER
        status:
          $ref: '#/components/schemas/ReservationStatus'
        holdExpiresAt:
          type: string
          format: date-time
        pickupDeadline:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        transitions:
          type: array
          description: Transition history, included only by `getReservation`
          items:
            $ref: '#/components/schemas/Transition'
    Transition:
      type: object
      required:
        - to
        - at
        - actor
      properties:
        from:
          $ref: '#/components/schemas/ReservationStatus'
        to:
          $ref: '#/components/schemas/ReservationStatus'
        at:
          type: string
          format: date-time
        actor:
          type: string
          enum:
            - AGENT
            - USER
            - SCHEDULER
            - HANDOVER
    HandoverStatus:
      type: string
      enum:
        - COMPLETED
        - MISMATCH
    HandoverResult:
      type: object
      required:
        - reservation
        - status
        - expectedQty
        - countedQty
        - boxes
      properties:
        reservation:
          $ref: '#/components/schemas/Reservation'
        status:
          $ref: '#/components/schemas/HandoverStatus'
        expectedQty:
          type: integer
          description: The reserved quantity
        countedQty:
          type: integer
          description: Muse Spark count of the reserved category in the photo
        boxes:
          type: array
          description: One box per counted item. SAM 3.1's box when it segmented the item, else Spark's
          items:
            $ref: '#/components/schemas/BoundingBox'
    ResolveHandoverRequest:
      type: object
      required:
        - acceptedQty
      properties:
        acceptedQty:
          type: integer
          minimum: 1
          description: Quantity actually handed over, 1 to the reserved quantity (more → 400 INVALID_INPUT)
    ReuseStats:
      type: object
      required:
        - totalReused
        - reusedVolumeLiters
        - byCategory
        - byEvent
      properties:
        totalReused:
          type: integer
          example: 7
        reusedVolumeLiters:
          type: integer
          format: int64
          minimum: 0
          description: |
            Bulk kept out of the waste stream: the sum of handedOverQty × width × depth × height of each
            handed-over item, from its registered size in cm (seed data or a human-confirmed intake draft),
            converted to liters and rounded down. An estimate of volume, not a weight.
          example: 864
        byCategory:
          type: array
          items:
            type: object
            required:
              - category
              - label
              - quantity
            properties:
              category:
                $ref: '#/components/schemas/ItemCategory'
              label:
                type: string
              quantity:
                type: integer
        byEvent:
          type: array
          items:
            type: object
            required:
              - eventId
              - eventName
              - quantity
            properties:
              eventId:
                type: integer
                format: int64
              eventName:
                type: string
              quantity:
                type: integer
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          $ref: '#/components/schemas/MemberPassword'
        newPassword:
          $ref: '#/components/schemas/MemberPassword'

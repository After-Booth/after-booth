            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
    post:
      operationId: holdItem
      tags:
        - reservations
      summary: Hold a specific item, e.g. an alternative the agent offered
      description: |
        Applies the hold rules in `HoldItemRequest`. Unlike the agent, any category may be held here, because
        alternatives can be a different category. Fails with QTY_UNAVAILABLE, PICKUP_CLOSED, VEHICLE_TOO_SMALL
        or QTY_EXCEEDS_REQUEST.
        Access: Only the receiver request organization's owner may execute this operation. Recheck the giver member's ACTIVE state and organization ownership immediately before a new HOLD.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldItemRequest'
      responses:
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Held
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/reservations/{reservationId}:
